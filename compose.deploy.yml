# Self-hosted deployment for a single machine, reachable from the local network
# (LAN) and from the Tailscale network.
#
# Two services: db (PostgreSQL) and backend. The backend image also builds and
# serves the frontend, so there is no separate frontend container. Traefik,
# Adminer, Mailpit and Playwright are not part of the deployment.
#
# Always pass -f and --env-file. Listing a single -f file also stops Docker
# Compose from loading compose.override.yml, the local development settings.
#
#   docker compose -f compose.deploy.yml --env-file .env.prod build
#   docker compose -f compose.deploy.yml --env-file .env.prod run --rm backend bash scripts/prestart.sh
#   docker compose -f compose.deploy.yml --env-file .env.prod up -d
#
# Configuration lives in .env.prod, created from env.prod.example.
# See deployment-docker-compose.md.

name: oxo

services:

  db:
    image: postgres:18
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app
    # No published port: the database is only reachable from the backend
    # container, never from the LAN or the tailnet.

  backend:
    image: backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        restart: true
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      # Reached at http://<lan-ip>:8000 and http://<tailscale-ip>:8000.
      # The compiled frontend calls the API on the same origin it was loaded
      # from, so one image serves both addresses without a rebuild.
      - "8000:8000"
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      # Base URL users open the app with, including the port. It is used to
      # build the password recovery link.
      FRONTEND_HOST: ${FRONTEND_HOST:?Variable not set}
      # Emails are optional: leaving these empty disables password recovery
      # by email.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-db-data:
    # Explicit volume name: the deployment must not collide with the development
    # database volume (oxo-dev-app-db-data).
    name: oxo-db-data
