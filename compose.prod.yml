# Minimal production deployment for a LAN / Tailscale network.
# Only two services: db (Postgres) and backend (FastAPI + built frontend).
# No Traefik, Adminer, Mailpit or Playwright.
#
# Usage (always with -f and --env-file, so compose.override.yml is NOT loaded):
#   docker compose -f compose.prod.yml --env-file .env.prod build
#   docker compose -f compose.prod.yml --env-file .env.prod run --rm backend bash scripts/prestart.sh
#   docker compose -f compose.prod.yml --env-file .env.prod up -d

services:

  db:
    image: postgres:18
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app
    # No "ports": the database is only reachable from the backend container,
    # not from the local network.

  backend:
    image: backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        restart: true
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      # Server port 80 -> container port 8000.
      # Open http://SERVER-IP/ (no need to type the port).
      # If port 80 is taken on the server, use "8000:8000".
      - "80:8000"
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      # URL users open the app with. Used to build the link in password
      # recovery emails (without it, the link points to localhost).
      FRONTEND_HOST: ${FRONTEND_HOST:?Variable not set}
      # Emails (optional). Empty = password recovery by email disabled.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-db-data:
