version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels:
      - "internal"
      - "dependencies"
      - "github_actions"
    groups:
      github-actions:
        patterns:
          - "*"
  # Python uv
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal]
    groups:
      # Routine updates only; a major matching no group gets its own PR.
      python-packages:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # bun
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal]
    ignore:
      # Pinned deliberately: its generated output is committed, and the SDK
      # regeneration is reviewed on its own.
      - dependency-name: "@hey-api/openapi-ts"
    groups:
      # Only routine updates are grouped. A major that matches no group is raised
      # as its own PR, so it can be reviewed and reverted alone. Grouping majors
      # is what produced a 31-package PR containing typescript 6->7, which broke
      # the generated client through a transitive API change.
      npm-packages:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # Docker
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    groups:
      docker:
        patterns:
          - "*"
  # Docker Compose
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    groups:
      docker-compose:
        patterns:
          - "*"
